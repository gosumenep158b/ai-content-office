<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-label="Mockup frame preview video faceless 9:16 AI Virtual Content Office">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B3A5C"/>
      <stop offset="0.55" stop-color="#0F2440"/>
      <stop offset="1" stop-color="#0A1826"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16294A"/>
      <stop offset="1" stop-color="#0F2440"/>
    </linearGradient>
  </defs>

  <!-- Latar -->
  <rect width="1080" height="1920" fill="url(#sky)"/>
  <!-- Matahari / aksen visual tengah -->
  <circle cx="540" cy="880" r="260" fill="url(#sun)" opacity="0.9"/>
  <circle cx="540" cy="880" r="340" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2"/>
  <circle cx="540" cy="880" r="430" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
  <!-- Siluet kota sederhana -->
  <g fill="#0A1826">
    <rect x="80" y="1180" width="140" height="200" rx="8"/>
    <rect x="250" y="1100" width="120" height="280" rx="8"/>
    <rect x="400" y="1230" width="160" height="150" rx="8"/>
    <rect x="590" y="1120" width="130" height="260" rx="8"/>
    <rect x="750" y="1210" width="110" height="170" rx="8"/>
    <rect x="890" y="1150" width="110" height="230" rx="8"/>
  </g>
  <g fill="#F59E0B" opacity="0.85">
    <rect x="110" y="1220" width="24" height="24" rx="4"/><rect x="150" y="1220" width="24" height="24" rx="4"/>
    <rect x="280" y="1140" width="24" height="24" rx="4"/><rect x="320" y="1140" width="24" height="24" rx="4"/>
    <rect x="620" y="1160" width="24" height="24" rx="4"/><rect x="660" y="1160" width="24" height="24" rx="4"/>
    <rect x="920" y="1190" width="24" height="24" rx="4"/>
  </g>

  <!-- Progress bar -->
  <rect x="0" y="150" width="1080" height="8" fill="#FFFFFF" opacity="0.25"/>
  <rect x="0" y="150" width="432" height="8" fill="#DC2626"/>
  <!-- Scene counter -->
  <g font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="600" fill="#FFFFFF">
    <rect x="64" y="180" width="110" height="52" rx="26" fill="#000000" opacity="0.45"/>
    <text x="119" y="216" text-anchor="middle">2 / 6</text>
  </g>
  <!-- Label PREVIEW -->
  <g font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" letter-spacing="2">
    <rect x="836" y="180" width="180" height="52" rx="26" fill="#DC2626"/>
    <text x="926" y="216" text-anchor="middle" fill="#FFFFFF">PREVIEW</text>
  </g>

  <!-- Teks hook -->
  <g font-family="Inter, system-ui, sans-serif" font-weight="800" fill="#FFFFFF">
    <text x="540" y="300" font-size="92" text-anchor="middle">Pagi selalu</text>
    <text x="540" y="400" font-size="92" text-anchor="middle">terburu-buru?</text>
  </g>

  <!-- Rel aksi kanan (ilustrasi UI TikTok) -->
  <g fill="#FFFFFF" opacity="0.9">
    <circle cx="980" cy="1000" r="42" fill="#FFFFFF" opacity="0.15"/>
    <path d="M980 976 c-14 0 -26 10 -26 24 c0 18 26 36 26 36 s26 -18 26 -36 c0 -14 -12 -24 -26 -24z" fill="#FFFFFF"/>
    <circle cx="980" cy="1150" r="42" fill="#FFFFFF" opacity="0.15"/>
    <circle cx="980" cy="1142" r="14" fill="none" stroke="#FFFFFF" stroke-width="5"/>
    <path d="M968 1162 q12 10 24 0" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <circle cx="980" cy="1300" r="42" fill="#FFFFFF" opacity="0.15"/>
    <path d="M962 1300 h36 M980 1282 v36" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Subtitle burned-in -->
  <g font-family="Inter, system-ui, sans-serif" font-weight="700">
    <rect x="64" y="1400" width="952" height="150" rx="20" fill="#0F2440" opacity="0.85"/>
    <text x="540" y="1462" font-size="56" text-anchor="middle" fill="#FFFFFF">Bangun 30 menit lebih awal.</text>
    <text x="540" y="1530" font-size="56" text-anchor="middle" fill="#FFFFFF">Bukan buat kerja, tapi buat <tspan fill="#F59E0B">napas.</tspan></text>
  </g>

  <!-- Zona bawah: caption + CTA -->
  <g font-family="Inter, system-ui, sans-serif">
    <text x="64" y="1660" font-size="34" font-weight="700" fill="#FFFFFF">@ai.content.office</text>
    <text x="64" y="1710" font-size="32" fill="#FFFFFF" opacity="0.85">Pagi yang tenang itu dirancang, bukan kebetulan.</text>
    <rect x="64" y="1760" width="420" height="84" rx="42" fill="#DC2626"/>
    <text x="274" y="1814" font-size="36" font-weight="700" text-anchor="middle" fill="#FFFFFF">Simpan video ini</text>
  </g>

  <!-- Zona aman (garis bantu, hanya untuk mockup) -->
  <g fill="none" stroke="#F59E0B" stroke-width="3" stroke-dasharray="14 10" opacity="0.7">
    <rect x="64" y="150" width="952" height="1410"/>
  </g>
  <g font-family="Inter, system-ui, sans-serif" font-size="26" fill="#F59E0B" opacity="0.9">
    <text x="64" y="135">ZONA AMAN</text>
  </g>
</svg>
