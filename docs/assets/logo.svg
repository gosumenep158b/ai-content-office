<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-label="Logo AI Virtual Content Office">
  <title>AI Virtual Content Office — logo lockup</title>
  <!-- Lockup horizontal: mark + wordmark. Font: Inter / system-ui (fallback saat dirender tanpa Inter). -->
  <g>
    <rect x="32" y="32" width="256" height="256" rx="56" fill="#0F2440"/>
    <path d="M128 108 L128 208 L200 158 Z" fill="#FFFFFF"/>
    <g stroke-linecap="round">
      <line x1="104" y1="228" x2="216" y2="228" stroke="#FFFFFF" stroke-width="12"/>
      <line x1="104" y1="248" x2="216" y2="248" stroke="#DC2626" stroke-width="12"/>
      <line x1="104" y1="268" x2="216" y2="268" stroke="#FFFFFF" stroke-width="12"/>
    </g>
  </g>
  <g font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="336" y="158" font-size="76" font-weight="800" fill="#0F2440" letter-spacing="-1">AI Virtual</text>
    <text x="340" y="224" font-size="34" font-weight="700" fill="#DC2626" letter-spacing="9">CONTENT OFFICE</text>
