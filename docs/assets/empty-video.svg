<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-label="Ilustrasi empty state: belum ada video">
  <title>Empty state — belum ada video</title>
  <!-- Flat illustration, palet brand. Tanpa teks — caption ditulis oleh aplikasi. -->
  <circle cx="240" cy="150" r="112" fill="none" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="10 10"/>
  <ellipse cx="240" cy="278" rx="90" ry="12" fill="#0F2440" opacity="0.08"/>
  <!-- Film strip -->
  <rect x="128" y="92" width="224" height="126" rx="16" fill="#FFFFFF" stroke="#0F2440" stroke-width="6"/>
  <g fill="#0F2440">
    <rect x="144" y="104" width="18" height="12" rx="3"/><rect x="144" y="194" width="18" height="12" rx="3"/>
    <rect x="318" y="104" width="18" height="12" rx="3"/><rect x="318" y="194" width="18" height="12" rx="3"/>
  </g>
  <!-- Play button -->
  <circle cx="240" cy="155" r="42" fill="#0F2440"/>
  <path d="M228 134 L228 176 L262 155 Z" fill="#FFFFFF"/>
  <!-- Play accent -->
  <path d="M262 155 L278 155" stroke="#DC2626" stroke-width="0"/>
  <circle cx="288" cy="132" r="7" fill="#DC2626"/>
  <!-- Motion lines -->
  <g stroke="#94A3B8" stroke-width="5" stroke-linecap="round">
    <line x1="150" y1="252" x2="330" y2="252"/>
    <line x1="180" y1="266" x2="300" y2="266"/>
  </g>
</svg>
