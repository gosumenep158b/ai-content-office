<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-label="Ilustrasi empty state: belum ada riset">
  <title>Empty state — belum ada riset</title>
  <!-- Flat illustration, palet brand. Tanpa teks — caption ditulis oleh aplikasi. -->
  <circle cx="240" cy="150" r="112" fill="none" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="10 10"/>
  <ellipse cx="240" cy="278" rx="90" ry="12" fill="#0F2440" opacity="0.08"/>
  <!-- Trend line -->
  <path d="M150 130 L205 104 L255 118 L315 78" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 10"/>
  <path d="M315 78 l-14 2 M315 78 l-2 14" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
  <!-- Bar chart -->
  <g>
    <rect x="168" y="168" width="34" height="56" rx="6" fill="#1B3A5C"/>
    <rect x="216" y="142" width="34" height="82" rx="6" fill="#0F2440"/>
    <rect x="264" y="116" width="34" height="108" rx="6" fill="#DC2626"/>
    <rect x="150" y="224" width="180" height="8" rx="4" fill="#CBD5E1"/>
  </g>
  <!-- Magnifier -->
  <g>
    <circle cx="316" cy="168" r="44" fill="#FFFFFF" fill-opacity="0.85" stroke="#0F2440" stroke-width="7"/>
    <line x1="348" y1="200" x2="380" y2="232" stroke="#0F2440" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
